<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carregando...</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #fce9d3;
        }
        /* Um spinner de carregamento simples em CSS */
        .spinner {
            border: 4px solid rgba(0, 0, 0, 0.1);
            width: 42px;
            height: 42px;
            border-radius: 50%;
            border-left-color: #6d4f43;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        p { margin-top: 20px; color: #555; font-size: 16px; }
    </style>
</head>
<body>
    <img src="https://www.tripadvisor.com.br/LocationPhotoDirectLink-g303293-d4574416-i295222789-Emporio_Brownie_Por_Mila_Ary-Fortaleza_State_of_Ceara.html" alt="Logo Empório Brownie" class="logo">
    <div class="spinner"></div>
    <p>Estamos te direcionando para a loja de aplicativos...</p>

    <script>
        // Substitua pelo seu OneLink real da AppsFlyer/Branch
        const seuOneLink = "https://onelink.to/xy2f8k"; 

        // Executa o redirecionamento após 1500 milissegundos (1.5 segundos)
        setTimeout(() => {
            window.location.href = seuOneLink;
        }, 1500);
    </script>
</body>
</html>
